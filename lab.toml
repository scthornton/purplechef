id      = "purplechef"
title   = "Purple team recipe orchestration"
intent  = ["a2a", "redteam"]
surface = "mac"
proves  = "MITRE-mapped purple-team recipes across Caldera and LimaCharlie with evidence chains. The demo script uses dry-run env vars and mock JSON, so it runs offline."

[run]
# demo/run-demos.sh is an interactive screencast script: it calls `read -p`
# between demos and, with set -e, aborts immediately in a non-TTY. Use a
# representative non-interactive command instead; the demo script is still
# the right thing to run by hand.
launch  = "uv run chef recipe run recipe_book/src/chef_recipes/recipes/credential-access/recipe.yml"
oneshot = true

[requires]
files = ["Makefile"]

[demo]
beats = [
  "no live C2 needed for the demo path",
]
